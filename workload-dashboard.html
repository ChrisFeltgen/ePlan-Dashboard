    var dates = listDatesStr(data.from, data.to);
    if (dates.length < 2) return '';
    var max = Math.max.apply(null, dates.map(function (d) { return counts[d] || 0; }).concat([1]));
    return '<div class="completed-daily-strip" role="img" aria-label="Completed tasks per day">' +
      dates.map(function (d) {
        var has = counts[d] != null;
        var h = has ? Math.max(3, Math.round((counts[d] / max) * 100)) : 0;
        return '<div class="completed-daily-col' + (has ? '' : ' missing') + '" title="' + escapeHtml(fmtDateStr(d, true, true)) + ': ' + (has ? fmtInt(counts[d]) + ' completed' : 'no history recorded') + '">' +
          '<div class="completed-daily-bar" style="height:' + h + '%"></div></div>';
      }).join('') +
    '</div>' +
    '<div class="completed-daily-axis"><span>' + escapeHtml(fmtDateStr(dates[0], false, true)) + '</span><span>' + escapeHtml(fmtDateStr(dates[dates.length - 1], false, true)) + '</span></div>';
  }

  // The individual reviews completed on a single day, filterable by text.
  function rowsToggleLabel(open, n) { return open ? 'Hide individual completed tasks' : 'Show ' + fmtInt(n) + ' individual completed tasks'; }
  function renderCompletedRowsSection(rows) {
    var open = !!state.rowsOpen;
    return '<div class="completed-rows-section">' +
      '<button type="button" class="completed-rows-toggle" id="completedRowsToggle" aria-expanded="' + open + '">' +
        '<span class="completed-rows-toggle-icon">' + ICON_LIST + '</span>' +
        '<span class="completed-rows-toggle-label">' + rowsToggleLabel(open, rows.length) + '</span>' +
        '<span class="chevron' + (open ? ' open' : '') + '">&rsaquo;</span>' +
      '</button>' +
      '<div id="completedRowsWrap"' + (open ? '' : ' hidden') + '>' +
      '<div class="completed-rows-head">' +
        '<input type="search" id="completedRowsFilter" placeholder="Filter by project, task, group, or name..." value="' + escapeHtml(state.rowsFilter || '') + '">' +
      '</div>' +
      '<div class="completed-rows-scroll"><table class="data-table completed-rows-table"><thead><tr>' +
        '<th>Time</th><th>Project</th><th>Location</th><th>Task</th><th>Group</th><th>Workflow</th><th>Completed by</th>' +
      '</tr></thead><tbody id="completedRowsBody"></tbody></table></div>' +
      '<div class="completed-rows-note" id="completedRowsNote"></div>' +
      '</div>' +
    '</div>';
  }
  function fillCompletedRows(rows) {
    var body = document.getElementById('completedRowsBody');
    if (!body) return;
    var needle = (state.rowsFilter || '').trim().toLowerCase();
    var shown = !needle ? rows : rows.filter(function (r) {
      return [r.proj, r.loc, r.task, r.grp, r.wf, r.user].join(' ').toLowerCase().indexOf(needle) !== -1;
    });
    body.innerHTML = shown.map(function (r) {
      return '<tr>' +
        '<td class="nowrap">' + escapeHtml(fmtClock(r.at)) + '</td>' +
        '<td class="nowrap"><b>' + escapeHtml(r.proj || ('Project ' + (r.pid == null ? '?' : r.pid))) + '</b></td>' +
        '<td>' + escapeHtml(r.loc || '') + '</td>' +
        '<td>' + escapeHtml(r.task || '') + '</td>' +
        '<td>' + escapeHtml(r.grp || '') + '</td>' +
        '<td>' + escapeHtml(r.wf || '') + '</td>' +
        '<td class="nowrap">' + escapeHtml(r.user || 'Unknown') + '</td>' +
      '</tr>';
    }).join('');
    var note = document.getElementById('completedRowsNote');
    if (note) note.textContent = needle ? 'Showing ' + fmtInt(shown.length) + ' of ' + fmtInt(rows.length) + ' completed reviews.' : '';
  }

  // Who completed what, sliced by workflow/group/reviewer depending on
  // state.completedView, for whichever period is selected. Always rendered
  // (even when nothing was completed) because it now also holds the date
  // controls - hiding it on a quiet day would hide the way to look at
  // another day.
  function renderCompletedToday(summary, allGroups) {
    var panel = document.getElementById('completedTodayPanel');
    if (!summary) { panel.style.display = 'none'; return; }
    panel.style.display = 'block';

    var mode = state.period || 'today';
    var today = easternTodayStr();
    var hist = state.history;
    var active = null; // the summary being displayed
    var bodyMessage = '';
    var histData = null;
    if (mode === 'today') {
      active = summary;
      if (!summary.TotalCount) bodyMessage = 'Nothing completed today yet.';
    } else if (hist && hist.status === 'ok') {
      histData = hist.data;
      active = histData.Summary;
      var missingN = (histData.MissingDays || []).length;
      var spanN = listDatesStr(histData.from, histData.to).length;
      if (!active.TotalCount) bodyMessage = missingN >= spanN
        ? 'This period has not been recorded yet. History is filled in a few days at a time with each refresh, so try Refresh now, or check back shortly.'
        : 'No completed tasks were recorded for this period.';
    } else if (hist && hist.status === 'loading') {
      bodyMessage = 'Loading...';
    } else {
      bodyMessage = (hist && hist.message) || 'Pick a date to see what was completed.';
    }
    if (!active) active = { TotalCount: 0, WorkflowCount: 0, GroupCount: 0, StaffCount: 0, ByWorkflow: [], ByGroup: [], ByReviewer: [] };

    // Per (workflow, group) staff breakdown, shown inline beside every group
    // row below - summary.ByGroup already carries this (collector.js
    // computes it once for the Group view), so the workflow view just needs
    // a fast key -> ByUser lookup instead of recomputing it.
    var groupUserMap = new Map();
    (active.ByGroup || []).forEach(function (g) {
      groupUserMap.set(g.WorkflowTemplate + '::' + g.GroupName, g.ByUser || []);
    });

    // Each group's still-open task count (data.Groups, independent of the
    // Task Workload search/filter box - Completed Today stays its own
    // self-contained summary) - lets the Workflow view's bars show today's
    // actual completion rate (done / (done + still open)) instead of a
    // share-of-the-busiest-group comparison that said nothing about how
    // much work that group has left. Only meaningful for TODAY: a past
    // day's or a range's "still open" isn't something this snapshot knows,
    // so those views (null map) fall back to comparing groups to each other.
    var openCountMap = null;
    if (mode === 'today') {
      openCountMap = new Map();
      (allGroups || []).forEach(function (g) {
        openCountMap.set(g.WorkflowTemplate + '::' + g.GroupName, g.OpenTaskCount || 0);
      });
    }

    var bodyHtml;
    if (bodyMessage) {
      bodyHtml = '<div class="empty-state">' + escapeHtml(bodyMessage) + '</div>';
    } else {
      bodyHtml = state.completedView === 'group' ? renderCompletedByGroup(active.ByGroup)
        : state.completedView === 'reviewer' ? renderCompletedByReviewer(active.ByReviewer)
        : renderCompletedByWorkflow(active.ByWorkflow, groupUserMap, openCountMap);
    }
    var dayRows = (mode === 'day' && histData && histData.Rows) ? histData.Rows : null;
    if (dayRows && dayRows.length) bodyHtml += renderCompletedRowsSection(dayRows);
    if (mode === 'range' && histData) bodyHtml = renderDailyStrip(histData) + bodyHtml;

    // Title / subtitle reflect the selected period.
    var title = 'Completed today', what = 'completed today';
    if (mode === 'day' && state.periodDay) { title = 'Completed \u2014 ' + fmtDateStr(state.periodDay, true, true); what = 'completed'; }
    if (mode === 'range' && state.periodFrom && state.periodTo) {
      title = 'Completed ' + fmtDateStr(state.periodFrom, false, state.periodFrom.slice(0, 4) !== state.periodTo.slice(0, 4)) + ' – ' + fmtDateStr(state.periodTo, false, true);
      what = 'completed';
    }

    // Days in the chosen range with no saved history (history is built up
    // over time, and only reaches back as far as the collector has filled
    // in) - said out loud so an empty stretch isn't read as "nothing
    // happened".
    var periodNote = '';
    if (mode !== 'today' && histData && histData.MissingDays && histData.MissingDays.length) {
      var miss = histData.MissingDays.length;
      periodNote = miss + ' day' + (miss === 1 ? '' : 's') + ' in this ' + (mode === 'day' ? 'selection' : 'range') + ' ha' + (miss === 1 ? 's' : 've') + ' no recorded history yet' +
        (histData.EarliestAvailable ? ' (earliest recorded day: ' + fmtDateStr(histData.EarliestAvailable, false, true) + ')' : '') + '. History fills in over time.';
    }

    var viewByHtml =
      '<div class="control-group controls-push-right">' +
        '<span class="control-label">View by</span>' +
        '<div class="view-toggle" id="completedViewToggle">' +
          '<button data-completed-view="workflow"' + (state.completedView === 'workflow' ? ' class="active"' : '') + '>Workflow</button>' +
          '<button data-completed-view="group"' + (state.completedView === 'group' ? ' class="active"' : '') + '>Group</button>' +
          '<button data-completed-view="reviewer"' + (state.completedView === 'reviewer' ? ' class="active"' : '') + '>Staff</button>' +
        '</div>' +
      '</div>';

    var periodRow =
      '<div class="controls-panel completed-period-row">' +
        '<div class="control-group">' +
          '<span class="control-label">Period</span>' +
          '<div class="view-toggle" id="completedPeriodToggle">' +
            '<button data-period="today"' + (mode === 'today' ? ' class="active"' : '') + '>Today</button>' +
            '<button data-period="day"' + (mode === 'day' ? ' class="active"' : '') + '>Day</button>' +
            '<button data-period="range"' + (mode === 'range' ? ' class="active"' : '') + '>Range</button>' +
          '</div>' +
        '</div>' +
        (mode === 'day'
          ? '<div class="control-group"><label class="control-label" for="completedDayInput">Date</label>' +
            '<input type="date" id="completedDayInput" value="' + escapeHtml(state.periodDay || '') + '" max="' + today + '"></div>'
          : '') +
        (mode === 'range'
          ? '<div class="control-group"><span class="control-label">Date range</span>' +
              '<div class="completed-date-pair">' +
                '<input type="date" id="completedFromInput" value="' + escapeHtml(state.periodFrom || '') + '" max="' + today + '" aria-label="From">' +
                '<span class="control-to">to</span>' +
                '<input type="date" id="completedToInput" value="' + escapeHtml(state.periodTo || '') + '" max="' + today + '" aria-label="To">' +
              '</div></div>' +
            '<div class="control-group"><span class="control-label">Quick range</span>' +
              '<div class="view-toggle" id="completedPresetToggle">' +
                '<button data-preset="7">Last 7 days</button><button data-preset="30">Last 30 days</button><button data-preset="mtd">This month</button>' +
              '</div></div>'
          : '') +
        viewByHtml +
      '</div>' +
      (periodNote ? '<div class="completed-period-note">' + escapeHtml(periodNote) + '</div>' : '');

    var footerText = mode === 'today'
      ? 'Counts reflect tasks completed today. Staff may appear in multiple workflows/groups.'
      : 'Counts reflect tasks completed in the selected period (from saved history). Staff may appear in multiple workflows/groups.';

    panel.innerHTML =
      '<div class="completed-panel-header">' +
        '<div class="completed-panel-title-wrap">' +
          '<div class="completed-check-icon">' + ICON_CHECK + '</div>' +
          '<div>' +
            '<h2 class="completed-panel-title">' + escapeHtml(title) + '</h2>' +
            '<div class="completed-panel-sub">' + fmtInt(active.TotalCount) + ' task' + (active.TotalCount === 1 ? '' : 's') + ' ' + what +
              ' &nbsp;&middot;&nbsp; ' + fmtInt(active.WorkflowCount) + ' workflow' + (active.WorkflowCount === 1 ? '' : 's') +
              ' &nbsp;&middot;&nbsp; ' + fmtInt(active.GroupCount) + ' group' + (active.GroupCount === 1 ? '' : 's') +
              ' &nbsp;&middot;&nbsp; ' + fmtInt(active.StaffCount) + ' staff' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      periodRow +
      '<div class="completed-panel-body">' + bodyHtml + '</div>' +
      '<div class="completed-panel-footer">' +
        '<span>' + footerText + '</span>' +
      '</div>';

    document.getElementById('completedViewToggle').querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.completedView = btn.getAttribute('data-completed-view');
        render();
      });
    });
    document.getElementById('completedPeriodToggle').querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var m = btn.getAttribute('data-period');
        if (m === (state.period || 'today')) return;
        setPeriod(m);
      });
    });
    var dayInput = document.getElementById('completedDayInput');
    if (dayInput) dayInput.addEventListener('change', function () { state.periodDay = dayInput.value; state.rowsFilter = ''; loadHistory(); });
    var fromInput = document.getElementById('completedFromInput');
    var toInput = document.getElementById('completedToInput');
    if (fromInput) fromInput.addEventListener('change', function () { state.periodFrom = fromInput.value; loadHistory(); });
    if (toInput) toInput.addEventListener('change', function () { state.periodTo = toInput.value; loadHistory(); });
    var presetToggle = document.getElementById('completedPresetToggle');
    if (presetToggle) presetToggle.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.getAttribute('data-preset');
        var t = easternTodayStr();
        state.periodTo = t;
        state.periodFrom = p === 'mtd' ? t.slice(0, 8) + '01' : addDaysStr(t, -(parseInt(p, 10) - 1));
        loadHistory();
      });
    });
    if (dayRows && dayRows.length) {
      fillCompletedRows(dayRows);
      var rowsToggle = document.getElementById('completedRowsToggle');
      if (rowsToggle) rowsToggle.addEventListener('click', function () {
        state.rowsOpen = !state.rowsOpen;
        document.getElementById('completedRowsWrap').hidden = !state.rowsOpen;
        rowsToggle.setAttribute('aria-expanded', state.rowsOpen);
        rowsToggle.querySelector('.chevron').classList.toggle('open', state.rowsOpen);
        rowsToggle.querySelector('.completed-rows-toggle-label').textContent = rowsToggleLabel(state.rowsOpen, dayRows.length);
      });
      var rowsFilter = document.getElementById('completedRowsFilter');
      if (rowsFilter) rowsFilter.addEventListener('input', function () { state.rowsFilter = rowsFilter.value; fillCompletedRows(dayRows); });
    }
    wireCompletedWorkflowRows();
    wireCompletedFlatMoreLinks();
    wireCompletedTaskPopovers();
  }

  function wireCompletedTaskPopovers() {
    document.querySelectorAll('.completed-person-chip.clickable').forEach(function (chip) {
      function toggle() {
        var key = chip.getAttribute('data-task-popover-key');
        completedTaskPopoverKey = completedTaskPopoverKey === key ? null : key;
        render();
      }
      chip.addEventListener('click', toggle);
      chip.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  }

  function wireCompletedFlatMoreLinks() {
    document.querySelectorAll('.completed-flat-more').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-flatmore-key');
        if (completedGroupTabShowAllKeys.has(key)) completedGroupTabShowAllKeys.delete(key); else completedGroupTabShowAllKeys.add(key);
        render();
      });
    });
  }

  // One row per group: its own bar/count plus its own reviewers inline to
  // the right - keyPrefix+userMap (workflow template -> summary.ByGroup
  // lookup) resolve which staff worked THAT group, so the group -> people
  // relationship is always visible instead of living behind a click or in a
  // separate aggregate pool that mixes everyone across the whole workflow.
  // Sorted alphabetically (not by count) so a department's position in the
  // list doesn't shift day to day. Every group shows - no cap/collapse.
  // One CSS Grid per bucket (not one flex row each) - a shared grid is what
  // makes the name/bar/count columns actually line up across every row,
  // since the name column's width is computed once, from the widest name in
  // the WHOLE list, instead of each row sizing its own name box
  // independently. Each row is a "display:contents" wrapper so its 4 pieces
  // become direct grid items (contents boxes don't participate in the grid
  // sizing themselves - only real content does).
  function completedGroupRows(entries, cls, emptyLabel, keyPrefix, groupUserMap, openCountMap) {
    if (!entries.length) return '<div style="color:var(--text-muted); font-size:12.5px;">' + emptyLabel + '</div>';
    var sorted = entries.slice().sort(function (a, b) {
      return (a.GroupName || '').localeCompare(b.GroupName || '');
    });
    // Only today has a meaningful "still open" (openCountMap present); a past
    // day or a range doesn't, so those views (null map) scale each bar
    // against the busiest group in the list instead.
    var maxCount = Math.max.apply(null, sorted.map(function (e) { return e.Count; }).concat([1]));
    var rowsHtml = sorted.map(function (e) {
      var name = e.GroupName || e.WorkflowTemplate || 'Unknown';
      var rowKey = keyPrefix + '::' + name;
      var pct, titleText;
      if (openCountMap) {
        // Completion rate for the day (done / (done + still open)), not a
        // share of whichever group is busiest - a bar scaled to the busiest
        // group said nothing about how much work THIS group still has left,
        // which is what "done vs remaining" actually means. A group with no
        // matching entry in data.Groups (nothing currently open) reads as
        // fully done (100%), which is correct - there's nothing left.
        var openCount = openCountMap.get(rowKey) || 0;
        var dayTotal = e.Count + openCount;
        pct = dayTotal ? (e.Count / dayTotal * 100) : 100;
        titleText = escapeHtml(name) + ': ' + fmtInt(e.Count) + ' completed, ' + fmtInt(openCount) + ' still open today (' + Math.round(pct) + '% done)';
      } else {
        pct = maxCount ? (e.Count / maxCount * 100) : 0;
        titleText = escapeHtml(name) + ': ' + fmtInt(e.Count) + ' completed';
      }
      var users = groupUserMap.get(rowKey) || [];
      return '<div class="completed-member-row">' +
        '<div class="completed-mini-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</div>' +
        (openCountMap ? '<div class="completed-mini-bar" title="' + titleText + '"><div class="completed-mini-bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' : '') +
        '<div class="completed-mini-count" title="' + titleText + '">' + fmtInt(e.Count) + '</div>' +
        '<div class="completed-member-chips">' + completedMemberChips(users, cls, rowKey) + '</div>' +
      '</div>';
    }).join('');
    var withBar = !!openCountMap;
    var head = '<div class="completed-grid-head">' +
      '<div>Group</div>' + (withBar ? '<div>Done vs open</div>' : '') + '<div style="text-align:right;">Completed</div>' +
      '<div>' + (cls === 'ops' ? 'Staff who processed' : 'Staff who completed') + ' (number of tasks)</div></div>';
    return '<div class="completed-group-grid' + (withBar ? '' : ' no-bar') + '">' + head + rowsHtml + '</div>';
  }

  // Operations chips (Review Coordinator/Submissions) are clickable - a
  // single group total there hides several distinct routing steps done by
  // the same person, which the popover below breaks back out. Review-group
  // chips stay static (cls !== 'ops') since a review group is normally one
  // homogeneous activity, not a mix of task types worth breaking out.
  function completedMemberChips(users, cls, rowKey) {
    if (!users.length) return '<span style="color:var(--text-muted); font-size:12px;">No individual breakdown available.</span>';
    var clickable = cls === 'ops';
    var openUser = null;
    var chipsHtml = '<div class="completed-people-grid">' +
      users.map(function (u) {
        var userKey = u.UserID != null ? String(u.UserID) : (u.UserName || 'unknown');
        var chipKey = rowKey + '::' + userKey;
        var isOpen = clickable && completedTaskPopoverKey === chipKey;
        if (isOpen) openUser = u;
        var interactiveAttrs = clickable
          ? ' data-task-popover-key="' + escapeHtml(chipKey) + '" tabindex="0" role="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '"'
          : '';
        return '<div class="completed-person-chip ' + cls + (clickable ? ' clickable' : '') + (isOpen ? ' active' : '') + '"' + interactiveAttrs + '>' +
          '<span class="completed-person-count">' + fmtInt(u.Count) + '</span>' + escapeHtml(u.UserName || 'Unknown') +
        '</div>';
      }).join('') +
    '</div>';
    // Group-wide per-task totals (everyone in this group, not just the
    // selected person) - computed from the same `users` list the chips
    // above already have, so the popover's bars can show "14 of the 42
    // Prescreen tasks the whole group completed" rather than 14's share of
    // just this one person's day.
    var groupTaskTotals = {};
    users.forEach(function (u) {
      (u.ByTask || []).forEach(function (t) {
        groupTaskTotals[t.TaskName] = (groupTaskTotals[t.TaskName] || 0) + t.Count;
      });
    });
    return chipsHtml + (openUser ? completedTaskPopover(openUser, groupTaskTotals) : '');
  }

  // Task-name order follows the real workflow sequence (Prescreen -> Assign
  // Reviewers -> Begin Review -> ... -> Batch Stamp), via
  // compareTaskNames/TASK_ORDER_HINTS - not alphabetical, not by count.
  function completedTaskPopover(user, groupTaskTotals) {
    var tasks = (user.ByTask || []).slice().sort(function (a, b) { return compareTaskNames(a.TaskName, b.TaskName); });
    // Each bar is this person's share of the GROUP's total for that specific
    // task ("Regina did 14 of the 42 Prescreen tasks the group completed"),
    // not a share of her own day - a task she barely touched should show a
    // short bar even if it happens to be a big chunk of her personal total.
    var rowsHtml = tasks.map(function (t) {
      var groupTotal = groupTaskTotals[t.TaskName] || t.Count;
      var pct = groupTotal ? (t.Count / groupTotal * 100) : 0;
      // No literal quote marks around the task name here - this string gets
      // embedded inside an HTML title="..." attribute below, and an
      // unescaped " closes that attribute early, silently truncating
      // everything after it (caught by inspecting the rendered title in a
      // browser - it cut off right before the task name every time).
      var titleText = escapeHtml(user.UserName || 'Unknown') + ' completed ' + fmtInt(t.Count) + ' of ' + fmtInt(groupTotal) + ' total ' + escapeHtml(t.TaskName) + ' tasks';
      return '<div class="completed-task-popover-name" title="' + titleText + '">' + escapeHtml(t.TaskName) + '</div>' +
        '<div class="completed-task-popover-count" title="' + titleText + '">' + fmtInt(t.Count) + '</div>' +
        '<div class="completed-mini-bar" title="' + titleText + '"><div class="completed-mini-bar-fill ops" style="width:' + pct + '%"></div></div>';
    }).join('');
    return '<div class="completed-task-popover">' +
      '<div class="completed-task-popover-header">' +
        '<span class="completed-task-popover-title">' + escapeHtml(user.UserName || 'Unknown') + '</span>' +
        '<span class="completed-task-popover-total"><b>' + fmtInt(user.Count) + '</b> completed</span>' +
      '</div>' +
      '<div class="completed-task-popover-grid">' +
        (rowsHtml || '<div style="grid-column: 1 / -1; color:var(--text-muted); font-size:12.5px;">No task breakdown available.</div>') +
      '</div>' +
    '</div>';
  }

  var ICON_GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
  function completedBucketHead(cls, title, total) {
    return '<div class="completed-bucket-head ' + cls + '">' +
      '<span class="completed-bucket-icon">' + (cls === 'ops' ? ICON_GEAR : ICON_LIST) + '</span>' +
      '<span>' + title + '</span><span class="completed-bucket-total">' + fmtInt(total) + ' total</span></div>';
  }

  function renderCompletedByWorkflow(byWorkflow, groupUserMap, openCountMap) {
    byWorkflow = byWorkflow || [];
    if (!byWorkflow.length) return '<div class="empty-state">Nothing completed today yet.</div>';
    byWorkflow = byWorkflow.slice().sort(function (a, b) { return compareWorkflowNames(a.WorkflowTemplate, b.WorkflowTemplate); });
    return byWorkflow.map(function (w) {
      var key = w.WorkflowTemplate;
      var isOpen = completedOpenKeys.has(key);
      var row = '<div class="completed-workflow-row' + (isOpen ? ' open' : '') + '" data-completed-key="' + escapeHtml(key) + '" tabindex="0" role="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        '<div class="completed-chevron">' + ICON_CHEVRON + '</div>' +
        '<span class="template-icon">' + ICON_WORKFLOW + '</span>' +
        '<div class="completed-workflow-name-wrap">' +
          '<span class="completed-workflow-name">' + escapeHtml(key) + '</span>' +
          '<span class="completed-workflow-count">' + fmtInt(w.Count) + ' completed</span>' +
        '</div>' +
        '<div class="completed-workflow-legend">' +
          '<span class="legend-item"><span class="swatch accepted"></span><b>' + fmtInt(w.ReviewGroups.Count) + '</b>&nbsp;Reviews</span>' +
          '<span class="legend-item"><span class="swatch pending"></span><b>' + fmtInt(w.Operations.Count) + '</b>&nbsp;Processing</span>' +
        '</div>' +
      '</div>';

      var detail = '';
      if (isOpen) {
        detail = '<div class="completed-detail">' +
          '<div class="completed-bucket">' +
            completedBucketHead('review', 'Reviews', w.ReviewGroups.Count) +
            completedGroupRows(w.ReviewGroups.ByGroup, 'review', 'No review tasks completed today.', key, groupUserMap, openCountMap) +
          '</div>' +
          '<div class="completed-bucket">' +
            completedBucketHead('ops', 'Processing', w.Operations.Count) +
            completedGroupRows(w.Operations.ByGroup, 'ops', 'No processing tasks completed today.', key, groupUserMap, openCountMap) +
          '</div>' +
        '</div>';
      }
      return '<div class="completed-workflow-block">' + row + detail + '</div>';
    }).join('');
  }

  function renderCompletedByGroup(byGroup) {
    byGroup = byGroup || [];
    if (!byGroup.length) return '<div class="empty-state">Nothing completed today yet.</div>';
    var max = Math.max.apply(null, byGroup.map(function (g) { return g.Count; }).concat([1]));
    return byGroup.map(function (g) {
      var pct = max ? (g.Count / max * 100) : 0;
      var barCls = g.IsOperations ? 'pending' : 'accepted';
      var chipCls = g.IsOperations ? 'ops' : 'review';
      var rowKey = g.WorkflowTemplate + '::' + g.GroupName;
      var showAll = completedGroupTabShowAllKeys.has(rowKey);
      var topUsers = showAll ? g.ByUser : g.ByUser.slice(0, 4);
      return '<div class="completed-flat-row">' +
        '<div class="completed-flat-main">' +
          '<div class="completed-flat-title">' + escapeHtml(g.GroupName) + (g.IsOperations ? '<span class="completed-flat-badge">Processing</span>' : '') + '</div>' +
          '<div class="completed-flat-sub">' + escapeHtml(g.WorkflowTemplate) + '</div>' +
        '</div>' +
        '<div class="bar-track completed-flat-bar" style="cursor:default;"><div class="bar-seg ' + barCls + '" style="left:0%; width:' + pct + '%"></div></div>' +
        '<div class="completed-flat-count">' + fmtInt(g.Count) + '</div>' +
        '<div class="completed-flat-people">' +
          topUsers.map(function (u) {
            return '<div class="completed-person-chip ' + chipCls + '"><span class="completed-person-count">' + fmtInt(u.Count) + '</span>' + escapeHtml(u.UserName || 'Unknown') + '</div>';
          }).join('') +
          (g.ByUser.length > topUsers.length
            ? '<button class="completed-flat-more" data-flatmore-key="' + escapeHtml(rowKey) + '">+' + (g.ByUser.length - topUsers.length) + ' more</button>'
            : (showAll && g.ByUser.length > 4 ? '<button class="completed-flat-more" data-flatmore-key="' + escapeHtml(rowKey) + '">Show less</button>' : '')) +
        '</div>' +
      '</div>';
    }).join('');
  }

  // Staff tab: Processing (Review Coordinator/Submissions) and Reviews are
  // two different kinds of work, so they're kept as two separate,
  // independently-ranked lists instead of one list sorted by a combined
  // total - a coordinator who closed 300 routing tasks isn't "busier" than
  // a reviewer who closed 15 technical reviews, so ranking them against
  // each other in one list was misleading.
  function renderCompletedByReviewer(byReviewer) {
    byReviewer = byReviewer || [];
    if (!byReviewer.length) return '<div class="empty-state">Nothing completed today yet.</div>';
    var processing = byReviewer.filter(function (r) { return (r.OperationsCount || 0) > 0; })
      .sort(function (a, b) { return b.OperationsCount - a.OperationsCount || (a.UserName || '').localeCompare(b.UserName || ''); });
    var reviewers = byReviewer.filter(function (r) { return (r.ReviewGroupsCount || 0) > 0; })
      .sort(function (a, b) { return b.ReviewGroupsCount - a.ReviewGroupsCount || (a.UserName || '').localeCompare(b.UserName || ''); });
    return '<div class="completed-staff-section">' +
        '<h3 class="completed-detail-col-title">Reviews</h3>' +
        completedStaffRows(reviewers, 'ReviewGroupsCount', 'accepted') +
      '</div>' +
      '<div class="completed-staff-section">' +
        '<h3 class="completed-detail-col-title">Processing</h3>' +
        completedStaffRows(processing, 'OperationsCount', 'pending') +
      '</div>';
  }

  function completedStaffRows(list, countField, barCls) {
    if (!list.length) return '<div style="color:var(--text-muted); font-size:12.5px;">No completions.</div>';
    var max = Math.max.apply(null, list.map(function (r) { return r[countField]; }).concat([1]));
    return list.map(function (r) {
      var count = r[countField];
      var pct = max ? (count / max * 100) : 0;
      var topWorkflows = r.ByWorkflow.slice(0, 3);
      return '<div class="completed-flat-row">' +
        '<div class="completed-flat-main">' +
          '<div class="completed-flat-title">' + escapeHtml(r.UserName || 'Unknown') + '</div>' +
          '<div class="completed-flat-sub">' + topWorkflows.map(function (w) { return escapeHtml(w.WorkflowTemplate) + ' (' + fmtInt(w.Count) + ')'; }).join(' &middot; ') + '</div>' +
        '</div>' +
        '<div class="bar-track completed-flat-bar" style="cursor:default;"><div class="bar-seg ' + barCls + '" style="left:0%; width:' + pct + '%"></div></div>' +
        '<div class="completed-flat-count">' + fmtInt(count) + '</div>' +
      '</div>';
    }).join('');
  }

  function wireCompletedWorkflowRows() {
    document.querySelectorAll('.completed-workflow-row').forEach(function (row) {
      function toggle() {
        var key = row.getAttribute('data-completed-key');
        if (completedOpenKeys.has(key)) completedOpenKeys.delete(key); else completedOpenKeys.add(key);
        render();
      }
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
  }

  // Simple, hand-drawn geometric icons (not traced from any icon library) -
  // one per stat tile, tinted via currentColor so the same markup works for
  // any of the .stat-icon color classes.
  var ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>';
  var ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16 9"/></svg>';
  // A single person with a claim-mark, not the plain checkmark used for
  // "done" - "Accepted" means someone picked the task up and is actively on
  // it, a different state from finished, so it shouldn't share Completed's icon.
  var ICON_ACCEPTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.2"/><path d="M4 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M15.3 14.7 L17.1 16.5 L20.3 13"/></svg>';
  var ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L21 19 L3 19 Z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="16.7" r="0.6" fill="currentColor" stroke="none"/></svg>';
  // A branch-then-merge flow (one step splitting into two parallel review
  // paths, then converging) - reads as "workflow" without being a generic
  // document/list icon already used elsewhere on the page.
  var ICON_WORKFLOW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="12" r="2.2"/><circle cx="12" cy="5.5" r="2.2"/><circle cx="12" cy="18.5" r="2.2"/><circle cx="20" cy="12" r="2.2"/><path d="M6 11 L9.5 7"/><path d="M6 13 L9.5 17"/><path d="M14.5 7 L18 11"/><path d="M14.5 17 L18 13"/></svg>';

  function renderStats(allGroups, visibleGroups, completedTodayTotal) {
    var totalOpen = 0, totalPending = 0, totalAccepted = 0, totalOverdue = 0;
    visibleGroups.forEach(function (g) {
      totalOpen += g.OpenTaskCount || 0;
      totalPending += g.PendingCount || 0;
      totalAccepted += g.AcceptedCount || 0;
      totalOverdue += countOverdue(g.Tasks);
    });
    var el = document.getElementById('statRow');
    el.innerHTML =
      statTile('Open tasks', fmtInt(totalOpen), 'neutral', ICON_LIST, 'All tasks not yet completed') +
      statTile('Pending', fmtInt(totalPending), 'pending', ICON_CLOCK, 'Pending: waiting in a group, not yet claimed by anyone') +
      statTile('In progress', fmtInt(totalAccepted), 'accepted', ICON_ACCEPTED, 'Accepted: someone has picked the task up and is working on it') +
      statTile('Overdue', fmtInt(totalOverdue), 'overdue', ICON_ALERT, 'Open tasks past their due date') +
      statTile('Completed today', fmtInt(completedTodayTotal), 'done', ICON_CHECK, 'Tasks completed today (Eastern time)');
  }

  function statTile(label, value, cls, icon, tip) {
    return '<div class="stat-tile ' + cls + '" title="' + escapeHtml(tip || '') + '"><div class="stat-icon ' + cls + '">' + icon + '</div>' +
      '<div class="stat-text"><div class="stat-label">' + label + '</div>' +
      '<div class="stat-value ' + cls + '">' + value + '</div></div></div>';
  }

  function groupByTemplate(groups) {
    var byTemplate = {};
    var order = [];
    groups.forEach(function (g) {
      var t = g.WorkflowTemplate || 'Unknown template';
      if (!byTemplate[t]) { byTemplate[t] = []; order.push(t); }
      byTemplate[t].push(g);
    });
    order.sort(compareWorkflowNames);
    return { byTemplate: byTemplate, order: order };
  }

  function renderChart(groups) {
    var container = document.getElementById('chartView');
    document.getElementById('tableView').style.display = 'none';
    container.style.display = 'block';

    if (groups.length === 0) {
      container.innerHTML = '<div class="empty-state">No review groups match the current filter.</div>';
      return;
    }

    var g = groupByTemplate(groups);
    var maxCount = Math.max.apply(null, groups.map(function (x) { return x.OpenTaskCount || 0; }).concat([1]));
    var reviewerNeedle = state.reviewerSearch.toLowerCase();
    var reviewerFilterActive = !!reviewerNeedle;

    var html = '';
    g.order.forEach(function (templateName) {
      var rows = g.byTemplate[templateName].slice().sort(function (a, b) {
        if (state.groupSort === 'name') return (a.GroupName || '').localeCompare(b.GroupName || '');
        return (b.OpenTaskCount || 0) - (a.OpenTaskCount || 0);
      });
      // "Completed only"/"Overdue only" are review modes, not workload views
      // - a department with nothing matching is just noise in either mode.
      if (state.taskView === 'completedOnly') {
        rows = rows.filter(function (r) { return (r.CompletedTodayCount || 0) > 0; });
      }
      if (state.taskView === 'overdueOnly') {
        rows = rows.filter(function (r) { return (r.Tasks || []).some(isOverdueTask); });
      }
      // Filtering by reviewer name is meant to answer "show me everything
      // this person has" across every department at once - a group with
      // nothing of theirs is noise here the same way an empty department is
      // in Completed only mode.
      if (reviewerFilterActive) {
        rows = rows.filter(function (r) { return (r.Tasks || []).some(function (t) { return taskMatchesReviewer(t, reviewerNeedle); }); });
      }
      if (!rows.length) return;
      var templateTotal = rows.reduce(function (s, r) { return s + (r.OpenTaskCount || 0); }, 0);

      html += '<div class="template-section"><h2 class="template-title">' +
        '<span class="template-icon">' + ICON_WORKFLOW + '</span>' +
        escapeHtml(templateName) +
        '<span class="template-sub">' + fmtInt(templateTotal) + ' open task' + (templateTotal === 1 ? '' : 's') + '</span></h2>' +
        '<div class="template-groups">' +
        '<div class="group-col-header group-grid-cols">' +
          '<div>Department</div><div class="num">Open</div><div>Status breakdown</div><div>Progress</div><div>Oldest waiting</div>' +
        '</div>';

      rows.forEach(function (row) {
        var key = templateName + '::' + row.GroupName;
        var pending = row.PendingCount || 0;
        var accepted = row.AcceptedCount || 0;
        var total = row.OpenTaskCount || 0;
        var completedToday = row.CompletedTodayCount || 0;
        var tasks = row.Tasks || [];
        // row.Tasks can include tasks Completed today alongside the open
        // ones - which of those the detail table shows depends on the
        // Tasks: Open / + Completed / Completed only / Overdue only toggle.
        // Overdue only pulls from every task regardless of status (isOverdueTask
        // itself already excludes Completed, so this can't surface a "completed
        // and overdue" contradiction).
        var detailTasks = state.taskView === 'completedOnly'
          ? tasks.filter(function (t) { return t.TaskStatus === 'Completed'; })
          : state.taskView === 'overdueOnly'
          ? tasks.filter(isOverdueTask)
          : state.taskView === 'withCompleted'
          ? tasks
          : tasks.filter(function (t) { return t.TaskStatus !== 'Completed'; });
        if (reviewerFilterActive) {
          detailTasks = detailTasks.filter(function (t) { return taskMatchesReviewer(t, reviewerNeedle); });
        }
        // Overdue is a status that can land on either a Pending or an Accepted
        // task; Pending/Accepted counts (and their sum to total) stay exactly
        // as ProjectDox reports them for the text summary. For the BAR only,
        // overdue tasks are pulled out into their own third segment - Pending
        // -> Accepted -> Overdue, three mutually exclusive buckets - since a
        // striped overlay on the other two turned out harder to read at a
        // glance than a plain solid segment.
        var pendingOverdue = countOverdue(tasks.filter(function (t) { return t.TaskStatus === 'Pending'; }));
        var acceptedOverdue = countOverdue(tasks.filter(function (t) { return t.TaskStatus === 'Accepted'; }));
        var overdueCount = pendingOverdue + acceptedOverdue;
        var pendingOk = pending - pendingOverdue;
        var acceptedOk = accepted - acceptedOverdue;

        var pctOf = function (n) { return maxCount ? (n / maxCount * 100) : 0; };
        var pendingPct = pctOf(pendingOk);
        var acceptedPct = pctOf(acceptedOk);
        var overduePct = pctOf(overdueCount);

        var oldestDays = oldestWaitingDays(tasks);

        var breakdownHtml = state.taskView === 'completedOnly'
          ? '<span class="n-completed">' + fmtInt(completedToday) + ' completed today</span>'
          : '<span class="n-pending">' + fmtInt(pending) + ' pending</span>' +
            ' &middot; <span class="n-accepted">' + fmtInt(accepted) + ' accepted</span>' +
            (overdueCount ? ' &middot; <span class="n-overdue">' + fmtInt(overdueCount) + ' overdue</span>' : '') +
            (state.taskView === 'withCompleted' && completedToday ? ' &middot; <span class="n-completed">' + fmtInt(completedToday) + ' completed today</span>' : '');

        var isOpen = openPanelKeys.has(key);
        html += '<div class="group-block group-grid-cols' + (isOpen ? ' open' : '') + '" data-key="' + escapeHtml(key) + '" tabindex="0" role="button" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
          '<div class="group-name"><span class="completed-chevron group-chevron">' + ICON_CHEVRON + '</span>' + escapeHtml(row.GroupName) + '</div>' +
          '<div class="group-open-cell">' + fmtInt(total) + '</div>' +
          '<div class="group-breakdown-cell">' + breakdownHtml + '</div>' +
          '<div class="bar-track" data-key="' + escapeHtml(key) + '" ' +
            'data-pending="' + pending + '" data-accepted="' + accepted + '" data-total="' + total + '" data-overdue="' + overdueCount + '" data-group="' + escapeHtml(row.GroupName) + '">' +
            '<div class="bar-seg pending" style="left:0%; width:' + pendingPct + '%"></div>' +
            '<div class="bar-seg accepted" style="left:' + pendingPct + '%; width:' + acceptedPct + '%"></div>' +
            '<div class="bar-seg overdue" style="left:' + (pendingPct + acceptedPct) + '%; width:' + overduePct + '%"></div>' +
          '</div>' +
          '<div class="group-oldest-cell">' + oldestWaitingPill(oldestDays) + '</div>' +
        '</div>';

        html += '<div class="detail-panel' + (isOpen ? ' open' : '') + '" id="panel-' + cssEscape(key) + '">' +
          (detailTasks.length ? renderTaskTable(detailTasks) : '<div style="color:var(--text-muted)">No task detail available for this group.</div>') +
          '</div>';
      });

      html += '</div></div>';
    });

    container.innerHTML = html || '<div class="empty-state">Nothing completed today yet in any visible group.</div>';

    // The whole group block (name, stats, bar - not just the 22px-tall bar
    // itself) is the click target for expanding/collapsing the task detail.
    container.querySelectorAll('.group-block').forEach(function (block) {
      function toggle() {
        var key = block.getAttribute('data-key');
        if (openPanelKeys.has(key)) openPanelKeys.delete(key); else openPanelKeys.add(key);
        renderChart(groups);
      }
      block.addEventListener('click', toggle);
      block.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });

    container.querySelectorAll('.bar-track').forEach(function (track) {
      track.addEventListener('mousemove', function (e) { showTooltip(e, track); });
      track.addEventListener('mouseleave', hideTooltip);
    });

    // One delegated listener covers every task table's Assigned/Accepted/Due
    // header, in every group, since they're all re-rendered together anyway.
    container.querySelectorAll('th.sortable').forEach(function (th) {
      th.addEventListener('click', function (e) {
        e.stopPropagation(); // don't also toggle the group block open/closed
        var field = th.getAttribute('data-sort-field');
        if (taskSort.field === field) {
          taskSort.dir = taskSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          taskSort.field = field;
          taskSort.dir = 'asc';
        }
        renderChart(groups);
      });
    });
  }

  function showTooltip(e, track) {
    var group = track.getAttribute('data-group');
    var pending = track.getAttribute('data-pending');
    var accepted = track.getAttribute('data-accepted');
    var total = track.getAttribute('data-total');
    var overdue = track.getAttribute('data-overdue');
    tooltip.innerHTML = '<strong>' + escapeHtml(group) + '</strong><br>' +
      total + ' open &middot; ' + pending + ' pending &middot; ' + accepted + ' accepted' +
      (overdue && overdue !== '0' ? ' &middot; <span style="color:#e66767">' + overdue + ' overdue</span>' : '') + '<br>' +
      '<span style="opacity:.7">Click bar for task details</span>';
    tooltip.style.display = 'block';
    var x = e.clientX + 14, y = e.clientY + 14;
    var vw = window.innerWidth, vh = window.innerHeight;
    tooltip.style.left = Math.min(x, vw - 300) + 'px';
    tooltip.style.top = Math.min(y, vh - 100) + 'px';
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  function renderTable(groups) {
    document.getElementById('chartView').style.display = 'none';
    var container = document.getElementById('tableView');
    container.style.display = 'block';

    if (groups.length === 0) {
      container.innerHTML = '<div class="empty-state">No review groups match the current filter.</div>';
      return;
    }

    var rows = groups.slice().sort(function (a, b) {
      if (a.WorkflowTemplate !== b.WorkflowTemplate) return (a.WorkflowTemplate || '').localeCompare(b.WorkflowTemplate || '');
      if (state.groupSort === 'name') return (a.GroupName || '').localeCompare(b.GroupName || '');
      return (b.OpenTaskCount || 0) - (a.OpenTaskCount || 0);
    });

    var html = '<table class="data-table"><thead><tr>' +
      '<th>Template</th><th>Review group</th><th class="num">Open</th><th class="num">Pending</th><th class="num">Accepted</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr><td>' + escapeHtml(r.WorkflowTemplate || '') + '</td>' +
        '<td>' + escapeHtml(r.GroupName || '') + '</td>' +
        '<td class="num">' + fmtInt(r.OpenTaskCount) + '</td>' +
        '<td class="num">' + fmtInt(r.PendingCount) + '</td>' +
        '<td class="num">' + fmtInt(r.AcceptedCount) + '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function cssEscape(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }

  document.getElementById('searchBox').addEventListener('input', function (e) {
    state.search = e.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById('reviewerSearchBox').addEventListener('input', function (e) {
    state.reviewerSearch = e.target.value.trim();
    // Undo exactly what the PREVIOUS search term auto-opened before doing
    // anything else - otherwise switching names (or clearing the box) just
    // keeps adding to openPanelKeys forever instead of putting things back
    // the way they were. A group the user opened by hand (not through this
    // search) was never added to reviewerAutoOpenKeys, so it's untouched.
    reviewerAutoOpenKeys.forEach(function (key) { openPanelKeys.delete(key); });
    reviewerAutoOpenKeys.clear();
    // Auto-open every group with a match so "show me this person" actually
    // shows their tasks right away instead of still requiring a click per
    // department.
    if (state.reviewerSearch && state.data) {
      var needle = state.reviewerSearch.toLowerCase();
      (state.data.Groups || []).forEach(function (g) {
        var hasMatch = (g.Tasks || []).some(function (t) { return taskMatchesReviewer(t, needle); });
        if (hasMatch) {
          var key = groupKey(g.WorkflowTemplate, g.GroupName);
          openPanelKeys.add(key);
          reviewerAutoOpenKeys.add(key);
        }
      });
    }
    render();
  });
  document.getElementById('showApplicant').addEventListener('change', function (e) {
    state.showApplicant = e.target.checked;
    render();
  });
  var TASK_VIEW_BTN_IDS = {
    open: 'taskViewOpenBtn', withCompleted: 'taskViewWithCompletedBtn',
    completedOnly: 'taskViewCompletedOnlyBtn', overdueOnly: 'taskViewOverdueOnlyBtn'
  };
  function setTaskView(view) {
    state.taskView = view;
    Object.keys(TASK_VIEW_BTN_IDS).forEach(function (v) {
      document.getElementById(TASK_VIEW_BTN_IDS[v]).classList.remove('active');
    });
    document.getElementById(TASK_VIEW_BTN_IDS[view]).classList.add('active');
    render();
  }
  document.getElementById('taskViewOpenBtn').addEventListener('click', function () { setTaskView('open'); });
  document.getElementById('taskViewWithCompletedBtn').addEventListener('click', function () { setTaskView('withCompleted'); });
  document.getElementById('taskViewCompletedOnlyBtn').addEventListener('click', function () { setTaskView('completedOnly'); });
  document.getElementById('taskViewOverdueOnlyBtn').addEventListener('click', function () { setTaskView('overdueOnly'); });
  document.getElementById('sortByTasksBtn').addEventListener('click', function () {
    state.groupSort = 'tasks';
    this.classList.add('active');
    document.getElementById('sortByNameBtn').classList.remove('active');
    render();
  });
  document.getElementById('sortByNameBtn').addEventListener('click', function () {
    state.groupSort = 'name';
    this.classList.add('active');
    document.getElementById('sortByTasksBtn').classList.remove('active');
    render();
  });
  document.getElementById('chartViewBtn').addEventListener('click', function () {
    state.view = 'chart';
    this.classList.add('active');
    document.getElementById('tableViewBtn').classList.remove('active');
    render();
  });
  document.getElementById('tableViewBtn').addEventListener('click', function () {
    state.view = 'table';
    this.classList.add('active');
    document.getElementById('chartViewBtn').classList.remove('active');
    render();
  });

  load();
  setInterval(load, AUTO_REFRESH_MS);
})();
</script>

</body>
</html>
